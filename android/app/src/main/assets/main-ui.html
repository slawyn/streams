<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Streams</title>
  <style>
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --accent: #2196f3;
      --text: #fff
    }

    html,
    body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden
    }

    .content {
      display: grid;
      grid-template-columns: 3fr 2fr;
      gap: 12px;
      padding: 12px;
      height: 100vh;
      box-sizing: border-box
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(5, 1fr);
      gap: 12px;
      overflow: hidden;
      padding: 3px;
      min-height: 0;
    }

    .card {
      background: var(--card);
      border-radius: 8px;
      padding: 8px;
      aspect-ratio: 1;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      cursor: pointer;
      min-width: 0
    }

    .card img {
      width: 100%;
      flex: 1;
      min-height: 0;
      object-fit: cover;
      border-radius: 6px
    }

    .name {
      margin-top: 8px;
      font-size: 14px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      width: 100%
    }

    .card:focus {
      outline: 3px solid var(--accent);
      outline-offset: 2px
    }

    .card.selected {
      outline: 3px solid #ffc107;
      outline-offset: 2px
    }

    .card.opened {
      background: #474747;
    }

    .program-column {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      height: 48px;
      box-sizing: border-box
    }

    .btn {
      background: var(--accent);
      color: #fff;
      border: 0;
      padding: 8px 12px;
      border-radius: 4px
    }

    .program-panel {
      flex: 1;
      background: var(--card);
      border-radius: 8px;
      padding: 12px;
      overflow-y: auto;
      min-width: 0;
      min-height: 0
    }

    .program-panel:focus {
      outline: 3px solid var(--accent);
      outline-offset: 2px
    }

    .program-header {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 12px
    }

    .program-item {
      display: flex;
      align-items: center;
      padding: 6px 4px;
      gap: 4px
    }

    .program-time {
      font-size: .75em;
      font-weight: bold;
      color: #888;
      background: rgba(128, 128, 128, .12);
      padding: .15em .4em;
      border-radius: 4px;
      margin-right: .4em;
      flex-shrink: 0
    }

    .program-item.past {
      opacity: .55
    }

    .program-item.hidden {
      display: none
    }

    .program-item.active {
      background: rgba(255, 193, 7, .15);
      border-left: 3px solid #ffc107;
      padding-left: 6px
    }

    .program-item.active .program-time {
      color: #ffc107;
      background: rgba(255, 193, 7, .2)
    }

    .no-program,
    .program-error {
      color: #888;
      padding: 12px 0
    }

    .footer {
      position: fixed;
      bottom: 8px;
      left: 8px;
      padding: 6px 10px;
      background: rgba(255, 255, 255, .03);
      border-radius: 6px;
      font-size: 12px
    }

    .debug {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: 12px;
      height: 20vh;
      max-height: 180px;
      overflow: auto;
      padding: 10px;
      box-sizing: border-box;

      /* 20% opacity */
      background: rgba(0, 0, 0, 0.20);
      color: #00ff66;

      font: 12px monospace;
      white-space: pre-wrap;

      z-index: 9999;

      /* Never interfere with TV remote/focus */
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;

      /* Optional: don't show text selection/caret */
      cursor: default;

      border-radius: 8px;
    }


    .program-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 20px 0;
      color: #888
    }

    .program-loading .gear {
      width: 22px;
      height: 22px;
      border: 3px solid rgba(255, 255, 255, .18);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: program-spin .8s linear infinite;
      box-sizing: border-box
    }

    @keyframes program-spin {
      to {
        transform: rotate(360deg)
      }
    }
  </style>
</head>

<body>
  <div class="content">
    <div id="grid" class="grid"></div>
    <div class="program-column">
      <div class="toolbar">
        <button class="btn" id="voiceInput">Voice</button>
        <button class="btn" id="loadRemote">Load Remote</button>
      </div>
      <div id="programPanel" class="program-panel" tabindex="0">
        <div id="programTitle" class="program-header">Program</div>
        <div id="program">
          <div class="no-program">Select a stream</div>
        </div>
      </div>
    </div>
  </div>
  <div class="debug hidden" id="debug"></div>
  <div class="footer" id="version">v</div>
  <script>
    let DEBUG_ENABLED = false;

    let streams = [], selectedIndex = -1, elements = {}, programRequestId = 0;
    let lastActivatedIndex = -1, lastActivatedTime = 0;
    const programCache = new Map(), ACTIVATION_DEBOUNCE = 450, LONG_PRESS = 600;

    function debug(...a) {
      const m = a.map(v =>
        typeof v === 'string'
          ? v
          : (() => {
            try {
              return JSON.stringify(v)
            } catch {
              return String(v)
            }
          })()
      ).join(' ');

      // Always send to Android log only when debug is enabled
      if (!DEBUG_ENABLED) return;

      console.log('[WEB]', m);

      const p = elements.debug || document.getElementById('debug');

      if (p) {
        const lines = p.textContent ? p.textContent.split('\n') : [];
        lines.push(m);

        p.textContent = lines.slice(-100).join('\n');
        p.scrollTop = p.scrollHeight;
      }
    }

    function normalizeName(text) {
      return String(text || '')
        .toLowerCase()
        .trim()
        .replace(/\s+/g, ' ');
    }

    function similarity(a, b) {
      a = normalizeName(a);
      b = normalizeName(b);

      if (!a || !b) return 0;
      if (a === b) return 1;

      // Exact phrase contained in the other name.
      // Example:
      // "россия" vs "россия 1" => 100% for the shorter name
      if (a.includes(b) || b.includes(a)) {
        return Math.min(a.length, b.length) / Math.max(a.length, b.length);
      }

      const rows = b.length + 1;
      const cols = a.length + 1;
      const dp = Array.from(
        { length: rows },
        () => Array(cols).fill(0)
      );

      for (let i = 0; i < rows; i++) dp[i][0] = i;
      for (let j = 0; j < cols; j++) dp[0][j] = j;

      for (let i = 1; i < rows; i++) {
        for (let j = 1; j < cols; j++) {
          dp[i][j] = b[i - 1] === a[j - 1]
            ? dp[i - 1][j - 1]
            : 1 + Math.min(
              dp[i - 1][j],
              dp[i][j - 1],
              dp[i - 1][j - 1]
            );
        }
      }

      return 1 - dp[b.length][a.length] / Math.max(a.length, b.length);
    }

    function selectChannelByVoice(text) {
      const query = normalizeName(text);
      if (!query) return;

      let bestIndex = -1;
      let bestScore = 0;

      streams.forEach((stream, index) => {
        const score = similarity(query, stream?.name);

        debug(
          'Voice match:',
          stream?.name,
          Math.round(score * 100) + '%'
        );

        if (score > bestScore) {
          bestScore = score;
          bestIndex = index;
        }
      });

      if (bestIndex >= 0 && bestScore >= 0.8) {
        const card = elements.grid.querySelector(
          `.card[data-index="${bestIndex}"]`
        );

        if (card) {
          card.focus();
          activateCard(bestIndex);

          debug(
            'Voice selected:',
            streams[bestIndex]?.name,
            Math.round(bestScore * 100) + '%'
          );
        }
      } else {
        debug(
          'No voice match:',
          text,
          Math.round(bestScore * 100) + '%'
        );
      }
    }

    function checkElement(n, id) {
      const e = document.getElementById(id);
      if (!e) debug('ERROR: missing element #' + id);
      elements[n] = e;
      return e
    }

    function checkAndroidFunction(n) {
      const e = !!window.Android && typeof window.Android[n] === 'function';
      debug('Android.' + n + ':', e ? 'OK' : 'MISSING');
      return e
    }

    function activateCard(i) {
      const n = Date.now();
      if (lastActivatedIndex === i && n - lastActivatedTime < ACTIVATION_DEBOUNCE) return;

      lastActivatedIndex = i;
      lastActivatedTime = n;

      const card = elements.grid.querySelector(`.card[data-index="${i}"]`);
      if (card) card.classList.add('opened');

      try {
        window.Android.onItemClicked(i)
      } catch (e) {
        debug('onItemClicked ERROR:', e.message || e)
      }
    }

    function activateLongClick(i) {
      try { window.Android.onItemLongClicked(i) } catch (e) { debug('onItemLongClicked ERROR:', e.message || e) }
    }

    function setupCard(card, index, name) {
      let timer = null, longPressed = false, keyActive = false, clickBlocked = false;
      const start = () => {
        if (timer) return;
        longPressed = false;
        timer = setTimeout(() => {
          timer = null;
          longPressed = clickBlocked = true;
          activateLongClick(index)
        }, LONG_PRESS)
      };
      const cancel = () => {
        if (timer !== null) { clearTimeout(timer); timer = null }
      };
      const finish = () => {
        if (!keyActive) return;
        keyActive = false;
        cancel();
        if (longPressed) {
          longPressed = false;
          setTimeout(() => clickBlocked = false, 300);
          return
        }
        activateCard(index);
        clickBlocked = true;
        setTimeout(() => clickBlocked = false, 300)
      };
      card.addEventListener('focus', () => setFocusedCard(card, index, name));
      card.addEventListener('keydown', e => {
        const select = [23, 'Enter', 'Select', 'OK'].includes(e.keyCode) || ['Enter', 'Select', 'OK'].includes(e.key);
        if (!select) return;
        e.preventDefault();
        e.stopPropagation();
        if (keyActive) return;
        keyActive = true;
        start()
      });
      card.addEventListener('keyup', e => {
        const select = [23, 'Enter', 'Select', 'OK'].includes(e.keyCode) || ['Enter', 'Select', 'OK'].includes(e.key);
        if (!select) return;
        e.preventDefault();
        e.stopPropagation();
        finish()
      });
      card.addEventListener('click', e => {
        e.preventDefault();
        e.stopPropagation();
        if (clickBlocked) { clickBlocked = false; return }
        if (keyActive || longPressed) { longPressed = false; return }
        activateCard(index)
      });
      card.addEventListener('pointerdown', e => {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        start()
      });
      card.addEventListener('pointerup', e => {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        cancel();
        if (longPressed) {
          longPressed = false;
          clickBlocked = true;
          setTimeout(() => clickBlocked = false, 300)
        }
      });
      card.addEventListener('pointercancel', () => {
        cancel();
        longPressed = false
      });
      card.addEventListener('pointerleave', () => { if (!keyActive) cancel() })
    }

    function showProgramLoading() {
      elements.program.innerHTML = '<div class="program-loading"><div class="gear"></div><span>Loading...</span></div>'
    }

    function renderProgram(list) {
      elements.program.innerHTML = '';
      if (!Array.isArray(list) || !list.length) {
        elements.program.innerHTML = '<div class="no-program">Keine Programmdaten verfügbar.</div>';
        return
      }
      for (const item of list) {
        if (!item?.time?.trim()) continue;
        const r = document.createElement('div');
        r.className = 'program-item';
        if (Array.isArray(item.attributes)) item.attributes.forEach(a => {
          if (typeof a === 'string' && a.trim()) r.classList.add(a)
        });
        const t = document.createElement('span'), n = document.createElement('span');
        t.className = 'program-time';
        t.textContent = item.time;
        n.className = 'program-title';
        n.textContent = item.title || '';
        r.append(t, n);
        elements.program.appendChild(r)
      }
    }

    function onProgramLoaded(id, index, data) {
      if (id !== programRequestId || index !== selectedIndex) return;
      try {
        if (!data) {
          if (programCache.has(index)) renderProgram(programCache.get(index));
          else throw Error()
        } else {
          const list = typeof data === 'string' ? JSON.parse(data) : data;
          if (!Array.isArray(list)) throw Error('Program response is not an array');
          programCache.set(index, list);
          renderProgram(list)
        }
      } catch (e) {
        if (programCache.has(index)) renderProgram(programCache.get(index));
        else elements.program.innerHTML = '<div class="program-error">Fehler beim Laden des TV-Programms.</div>'
      }
    }

    function loadProgram(index, name) {
      const id = ++programRequestId;
      selectedIndex = index;
      elements.programTitle.textContent = name || 'Program';
      const cached = programCache.get(index);
      cached ? renderProgram(cached) : showProgramLoading();
      try { window.Android.loadProgram(index, id) } catch (e) {
        if (id === programRequestId && !cached)
          elements.program.innerHTML = '<div class="program-error">Fehler beim Laden des TV-Programms.</div>'
      }
    }

    function setFocusedCard(card, index, name) {
      document.querySelectorAll('.card.selected').forEach(e => e.classList.remove('selected'));
      card.classList.add('selected');
      if (selectedIndex !== index) loadProgram(index, name)
    }

    function updateStreams(json) {
      try {
        const data = typeof json === 'string' ? JSON.parse(json) : json;
        if (!Array.isArray(data)) return;
        streams = data;
        selectedIndex = -1;
        elements.grid.innerHTML = '';
        streams.forEach((s, i) => {
          if (!s || typeof s !== 'object') return;
          const c = document.createElement('div'), img = document.createElement('img'), n = document.createElement('div');
          c.className = 'card';
          c.tabIndex = 0;
          c.dataset.index = i;
          img.src = s.logo || '';
          img.alt = s.name || '';
          img.onerror = () => img.style.visibility = 'hidden';
          n.className = 'name';
          n.textContent = s.name || '';
          c.append(img, n);
          setupCard(c, i, s.name || '');
          elements.grid.appendChild(c)
        });
        moveFocusToCard(0)
      } catch (e) { debug('updateStreams ERROR:', e.message || e) }
    }

    function applyTranslations() {
      try {
        const t = window.translations || {};
        if (t.title) document.title = t.title;
        if (t.loadRemote) elements.loadRemote.textContent = t.loadRemote;
        if (t.voiceInput) elements.voiceInput.textContent = t.voiceInput;
        elements.programTitle.textContent = t.program || 'Program';
        const m = elements.program.querySelector('.no-program');
        if (m) m.textContent = t.selectStream || 'Select stream';
        window.remoteLoadNotAvailableMessage = t.remoteLoadNotAvailable || 'Remote load not available'
      } catch (e) { debug('translations ERROR:', e.message || e) }
    }

    function initMeta() {
      try { elements.version.textContent = window.Android.getVersion() || 'v' } catch (e) { }
    }

    function moveFocusToCard(index = 0) {
      const cards = elements.grid.querySelectorAll('.card');
      if (!cards.length) return;
      cards[Math.max(0, Math.min(index, cards.length - 1))].focus()
    }

    function moveFocusToProgram() {
      elements.programPanel.focus()
    }

    function init() {
      DEBUG_ENABLED = !!window.Android && typeof window.Android.isDebug === 'function' && window.Android.isDebug();

      ['grid', 'program', 'programTitle', 'programPanel', 'version', 'loadRemote', 'voiceInput', 'debug'].forEach(id => checkElement(id, id));
      if (!elements.grid || !elements.program || !elements.programTitle || !elements.programPanel || !elements.version || !elements.loadRemote) return;
      if (window.Android) {
        ['loadProgram', 'onItemClicked', 'onItemLongClicked', 'loadRemoteStreams', 'requestLocalStreams', 'getBaseUrl', 'getVersion', 'isDebug', 'startVoiceInput'].forEach(checkAndroidFunction)
      }
      elements.loadRemote.addEventListener('click', () => {
        try { window.Android.loadRemoteStreams() } catch (e) { debug('loadRemoteStreams ERROR:', e.message || e) }
      });
      elements.loadRemote.addEventListener('keydown', e => {
        if (e.key !== 'ArrowDown' && e.keyCode !== 20) return;
        e.preventDefault();
        e.stopPropagation();
        const selected = elements.grid.querySelector('.card.selected');
        moveFocusToCard(selected ? Number(selected.dataset.index) : 0)
      });
      elements.voiceInput.addEventListener('click', () => {
        try {
          window.Android.startVoiceInput();
        } catch (e) {
          debug('startVoiceInput ERROR:', e.message || e);
        }
      });
      elements.grid.addEventListener('keydown', e => {
        if (e.key !== 'ArrowRight') return;
        const cards = [...elements.grid.querySelectorAll('.card')], current = document.activeElement, index = cards.indexOf(current);
        if (index < 0) return;
        if (index % 5 !== 4 && index !== cards.length - 1) return;

        e.preventDefault();
        e.stopPropagation();
        moveFocusToProgram()
      });
      elements.programPanel.addEventListener('keydown', e => {
        if (e.key !== 'ArrowLeft') return;
        e.preventDefault();
        e.stopPropagation();
        const selected = elements.grid.querySelector('.card.selected');
        moveFocusToCard(selected ? Number(selected.dataset.index) : 0)
      });
      document.addEventListener('focusin', e => {
        if (!e.target.closest('.card'))
          document.querySelectorAll('.card.selected').forEach(c => c.classList.remove('selected'))
      });
      initMeta();
      applyTranslations();
      try { window.Android.requestLocalStreams() } catch (e) { debug('requestLocalStreams ERROR:', e.message || e) }
      elements.voiceInput.focus();

    }

    document.addEventListener('DOMContentLoaded', init);
    window.onVoiceInput = function (text) {
      debug('Voice input:', text);
      selectChannelByVoice(text);
    };

  </script>
</body>

</html>
